{{ define "main" }}
  <article class="prose">
    <div class="hero">
      <div class="hero-copy">
        <h1>{{ .Site.Title }}</h1>
        <p class="lede">{{ .Site.Params.description }}</p>
        <div class="specrow">
          <div><span class="k">Board</span><span class="v">{{ .Site.Params.board }}</span><span class="sub">{{ .Site.Params.mcu }}</span></div>
          <div><span class="k">Protocols</span><span class="v">{{ .Site.Params.protocols }}</span></div>
          <div><span class="k">Throttle</span><span class="v">4–16 notches</span><span class="sub">speed steps 0–126</span></div>
          <div><span class="k">Input</span><span class="v">Dial · touch · keypad</span><span class="sub">RFID loco select</span></div>
        </div>
      </div>
      <figure class="hero-device">
        <img src="{{ "img/dial-throttle.png" | relURL }}" width="740" height="820"
             alt="The assembled throttle in its printed case: an M5Stack Dial with an orange knob above a twelve-key Qwiic keypad. The screen shows loco S3 at speed 24, notch 5 of 8, running forward.">
      </figure>
    </div>
    {{ .Content }}
  </article>
{{ end }}
