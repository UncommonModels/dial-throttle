baseURL = 'https://ngpaladi.github.io/dial-throttle/'
languageCode = 'en-us'
title = 'Dial Throttle'
enableGitInfo = false

[params]
  # Shared Uncommon Models brand layer, published from the org site. Override for
  # local work against an unreleased brand.css:
  #   HUGO_PARAMS_BRANDCSS=http://127.0.0.1:4000/css/brand.css hugo server
  brandCSS = 'https://www.uncommonmodels.com/css/brand.css'
  description = 'An M5Stack Dial handheld throttle for JMRI WiThrottle and LCC layouts.'
  repo = 'https://github.com/ngpaladi/dial-throttle'
  org = 'Uncommon Models'
  orgURL = 'https://uncommonmodels.com'
  board = 'M5Stack Dial'
  mcu = 'ESP32-S3'
  protocols = 'WiThrottle · LCC'

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
  style = 'github'

