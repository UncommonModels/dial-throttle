name: Build Firmware

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino core and libraries
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-${{ hashFiles('DialThrottle/sketch.yaml') }}

      - name: Update indexes
        run: arduino-cli core update-index && arduino-cli lib update-index

      - name: Build
        run: make build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: DialThrottle-firmware
          path: build/DialThrottle.ino.*.bin
