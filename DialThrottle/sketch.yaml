profiles:
  m5dial:
    notes: M5Stack Dial (ESP32-S3), USB CDC serial, 8MB flash
    fqbn: esp32:esp32:m5stack_dial:CDCOnBoot=cdc,USBMode=hwcdc,FlashSize=8M,PartitionScheme=default_8MB,DebugLevel=none
    platforms:
      - platform: esp32:esp32 (3.1.3)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - M5Dial (1.0.3)
      - M5Unified (0.2.22)
      - M5GFX (0.2.29)
      - SparkFun Qwiic Keypad Arduino Library (1.2.0)
      - MySQL Connector Arduino (1.2.0)
default_profile: m5dial
